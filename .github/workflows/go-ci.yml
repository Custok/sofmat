name: go-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build (pure-Go planes)
        run: CGO_ENABLED=0 go build ./cmd/... ./internal/transport/... ./internal/gateway/... ./internal/partitioner/...
